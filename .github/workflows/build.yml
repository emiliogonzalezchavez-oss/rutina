name: Compilar app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Usar el Xcode más nuevo
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Crear icono
        run: |
          mkdir -p Assets.xcassets/AppIcon.appiconset
          sips -s format png -z 1024 1024 icon.jpg --out Assets.xcassets/AppIcon.appiconset/AppIcon.png
          echo '{"info":{"author":"xcode","version":1}}' > Assets.xcassets/Contents.json
          echo '{"images":[{"filename":"AppIcon.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Compilar
        run: |
          xcodebuild -project Rutina.xcodeproj -target Rutina \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Mostrar errores (si falló)
        if: failure()
        run: grep -E "error:" build.log | head -40 || true

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/Rutina.app Payload/
          zip -qr Rutina.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Rutina-ipa
          path: Rutina.ipa
